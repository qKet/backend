plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.exam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation("org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5")
	runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	// HOLD01_HOLD03: 좌석 동시 선점 방지용 분산 락(RLock). spring.data.redis.host/port를 그대로
	// 읽어서 붙으므로(스타터 자동설정) 별도 접속 설정 불필요 — 세션/대기열과 같은 Redis 인스턴스를 공유함
	implementation 'org.redisson:redisson-spring-boot-starter:3.50.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//사용자 비밀번호 암호화
	implementation 'org.springframework.security:spring-security-crypto'
	//헬스체크 "/actuator/health"
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Prometheus 지표
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// AWS S3
	implementation platform('software.amazon.awssdk:bom:2.27.7')
	implementation 'software.amazon.awssdk:s3'
	// IRSA(웹 아이덴티티 토큰)로 EKS 파드가 AWS 자격증명을 받으려면 sts 모듈이 클래스패스에 있어야 함
	// (없으면 WebIdentityTokenCredentialsProvider가 조용히 스킵되고 다른 자격증명 방식들도 다 실패함)
	implementation 'software.amazon.awssdk:sts'
	// 회원가입 이메일 인증번호/예매확정·취소 알림(notification-queue-url)과
	// 취소표 알림(NOTI01_ALERT01, cancel-alert-queue-url) 발행용 — 큐는 서로 다르지만 SDK는 공유
	implementation 'software.amazon.awssdk:sqs'

	// SQS 메시지 body(JSON) 조립용 — 웹 스타터에 이미 포함돼 있지만 직접 의존성으로 명시
	implementation 'com.fasterxml.jackson.core:jackson-databind'
}

tasks.named('test') {
	useJUnitPlatform()
}
