server:
  port: 8080
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qket}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      # 2026-08-13: replica × pool size 총합이 db.t3.micro의 max_connections(~85)를 훌쩍 넘겨서
      # (8대 × 40 = 320) 커넥션 "생성" 자체가 병목이 되는 걸 실측으로 확인(HikariCP pending 급증,
      # 정작 RDS CPU는 9%로 한가함 — DB가 못 받아준 게 아니라 못 만들어준 것). 이후로는
      # "replica 수 × 이 값"이 RDS 상한 안에 여유 있게 들어오도록 배포 쪽(CD 레포)에서 관리.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # max와 동일하게 — 트래픽 몰릴 때 그제서야 새 커넥션을 만드는 대신, 파드 시작 시점에
      # 미리 다 열어둬서 "커넥션 생성 폭주"(위 사고 원인) 자체를 없앰
      minimum-idle: ${DB_POOL_SIZE:20}
      # 3초 안에 풀에서 커넥션을 못 받으면 빠르게 실패 — 기본값(30초)만큼 요청이 pending으로
      # 쌓여있다가 뒤늦게 타임아웃되는 것보다, 빨리 실패해서 사용자가 재시도하는 게 낫다고 판단
      connection-timeout: 3000

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    store-type: redis
    timeout: 1800s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: qket-backend
# AWS S3
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:qket-posters}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    cloudfront:
      domain: ${CLOUDFRONT_DOMAIN:}
    # SQS -> Lambda -> SES 알림 파이프라인. 큐 URL 미설정(로컬 기본값 빈 문자열)이면 발행 쪽에서
    # 스킵하도록 처리되어 있어서 로컬은 이 값 없이도 정상 기동됨
    sqs:
      # 회원가입 이메일 인증 + 예매확정/취소 알림이 공유(메시지의 type 필드로 Lambda가 구분)
      notification-queue-url: ${NOTIFICATION_QUEUE_URL:}
      # 예매 오픈 알림 전용 — 위 큐와 별개
      open-alert-queue-url: ${OPEN_ALERT_QUEUE_URL:}

# mybatis
mybatis:
  mapper-locations: com/exam/**/mapper/*.xml
  type-aliases-package: com.exam.common.dto, com.exam.reservation.dto, com.exam.auth.dto, com.exam.admin.dto, com.exam.payment.dto, com.exam.notification.dto
  map-underscore-to-camel-case: true

# App - 소셜 로그인 완료 후 리다이렉트할 프론트엔드 origin
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}

# 소셜 로그인 (OAuth2) client-id/secret — 각 provider 개발자 콘솔에서 발급
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

# 토스페이먼츠 시크릿 키 — 기본값은 토스 공식 위젯 연동 가이드에 공개된 테스트 전용 키
# (frontend/.env.local 의 NEXT_PUBLIC_TOSS_CLIENT_KEY=test_gck_docs_... 와 짝을 이루는 시크릿 키)
toss:
  secret-key: ${TOSS_SECRET_KEY:}
